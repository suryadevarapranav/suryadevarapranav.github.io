theme: jekyll-theme-chirpy

lang: en
timezone: America/New_York

title: Bits & Builds
tagline: Build cool stuff. Share what you learn.
description: >-
  A blog by Pranav about building projects, learning new tech, and sharing
  the journey — one bit at a time.

url: "https://suryadevarapranav.github.io"
baseurl: ""

github:
  username: suryadevarapranav

social:
  name: Pranav Suryadevara
  links:
    - https://github.com/suryadevarapranav

theme_mode:

avatar:

toc: true

paginate: 10

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _tabs
      type: pages
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed
